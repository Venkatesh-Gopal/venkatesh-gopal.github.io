name: Portfolio checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run lint:style-contract
      - run: node --check assets/portfolio/portfolio.js
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - run: python test/check_portfolio.py _site
